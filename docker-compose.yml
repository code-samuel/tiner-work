services:
  db:
    image: mysql:latest
    container_name: tinerwork_db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: TinerWork
    ports:
      - "3306:3306"
    volumes:
      # Aponta para o arquivo que está na pasta data/
      - ./data/Database.sql:/docker-entrypoint-initdb.d/Database.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
